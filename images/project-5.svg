    <!-- Code Text -->
    <text x="80" y="250" fill="#88c0d0" font-family="monospace" font-size="18">SELECT user_id, COUNT(*) AS activities</text><text x="80" y="285" fill="#88c0d0" font-family="monospace" font-size="18">FROM user_events</text><text x="80" y="320" fill="#88c0d0" font-family="monospace" font-size="18">GROUP BY user_id ORDER BY activities DESC;</text>

